<!-- NOTE: this HTML file serves as a synthesis of freeCodeCamp's Responsive Web Design - HTML lessons -->
<!DOCTYPE html>
<html lang="en">
  <head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML 5 with Gaia</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <!-- <script src="index.js"></script> -->
  </head>
  <body>
    <main>
      <h1>Hello Gaia!</h1>
      <br>
      <section>
        <h2>Gaia, The Earth Mother</h2>
        <!-- Note the nested anchor <a> element in the paragraph element below – especially the target attribute (set to a value of "_blank") which opens the link in a new tab-->
        <p>Gaia is the primordial goddess of the Earth and is the mother of many of the gods, <a target="_blank" href="https://en.wikipedia.org/wiki/Titans">Titans</a>, and all living creatures.</p>
        <figure> <!-- wrapping image elements in figure elements is good practice for semantic HTML -->
          <img src="images/earth-mother.jpg" alt="Earth Mother painting by Sir Edward Burne Jones">
          <!-- Note the emphasis and strong elements used on text within the figcaption element below -->
          <figcaption><em>Earth Mother</em> – Sir Edward Burne-Jones <strong>1882</strong></figcaption>
        </figure>
      </section>
      <section>
        <h2>Telus</h2>
        <p></p>
        <figure>
          <a target="_blank" href="https://en.wikipedia.org/wiki/Ara_Pacis#Exterior_wall_decoration"><img src="images/telus.jpeg" alt="place text here"></a>
          <figcaption></figcaption>
        </figure>
      </section>
      <section>
        <h2>Gaia Lists</h2>
        <h3>Whence came Gaia?</h3>
        <ol>
          <li>Kaos</li>
          <li></li>
          <li></li>
        </ol>
        <h3>Epithets of Gaia</h3>
        <ul>
          <li></li>
          <li></li>
          <li></li>
        </ul>
      </section>
    </main>
   <footer>
     
   </footer>
  </body>
</html>
